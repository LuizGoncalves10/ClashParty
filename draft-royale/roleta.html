<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draft Royale | Roleta da Batalha</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="roleta.css">
</head>
<body>
    <header class="arena-header">
        <h1>Sorteio do Turno</h1>
        <p>Gire a roleta para definir o desafio desta rodada!</p>
    </header>

    <main class="roleta-wrapper">
        <div class="roleta-container">
            <div class="setinha"></div>
            <div id="roda" class="roda"></div>
            <div class="pino-central"></div>
        </div>

        <div class="botoes-container">
            <button id="btn-girar" class="btn-supercell" onclick="girarRoleta()">GIRAR A ROLETA</button>
        </div>

        <div id="caixa-resultado" class="resultado-box vazia">
            <p id="texto-pergunta" class="pergunta-texto">?</p>
            <h2 id="texto-efeito" class="efeito-texto">Aguardando sorteio...</h2>
        </div>

        <div id="opcoes-pergunta" class="opcoes-container" style="display: none;">
            <p id="titulo-opcoes" class="titulo-opcoes"></p>
            <div id="lista-opcoes" class="lista-opcoes"></div>
        </div>
    </main>

    <script src="perguntas/individuais.js"></script>
    <script src="perguntas/coletivas.js"></script>
    <script src="perguntas/ajustes.js"></script>
    <script src="roleta.js"></script>
</body>
</html>
