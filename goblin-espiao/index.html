<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goblin Espião | Clash Party</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="tela-config" class="screen active">
        <header style="margin-bottom: 20px; text-align: center;">
            <h1 style="color: var(--dourado);">Goblin Espião</h1>
            <p style="font-family: sans-serif; font-weight: bold; font-size: 1.2rem; margin-top: 5px;">Blefe na Arena</p>
        </header>

        <main class="games-container">
            <div class="game-card">
                <div class="seletor-grupo">
                    <label>Escolha o Universo:</label>
                    <div class="botoes-grupo">
                        <button class="btn-opcao active" id="btn-uni-clash" onclick="selecionarUniverso('clash')">👑 Clash Royale</button>
                        <button class="btn-opcao" id="btn-uni-brawl" onclick="selecionarUniverso('brawl')">⭐ Brawl Stars</button>
                    </div>
                </div>

                <div class="area-jogadores">
                    <div class="header-jogadores">
                        <label id="contador-jogadores">Jogadores (3/10):</label>
                        <span class="dica-ordem">O 1º da lista começa falando</span>
                    </div>

                    <div id="lista-inputs-jogadores" class="lista-inputs"></div>

                    <button type="button" class="btn-adicionar" id="btn-add-jogador" onclick="adicionarJogador()">+ ADICIONAR JOGADOR</button>

                    <div id="erro-config" class="error-msg"></div>
                </div>

                <div class="botoes-nav">
                    <a href="../index.html" class="btn-supercell btn-voltar">VOLTAR</a>
                    <button class="btn-supercell btn-iniciar" id="btn-jogar" onclick="iniciarJogo()" disabled>JOGAR</button>
                </div>
            </div>
        </main>
    </div>

    <div id="tela-entrega" class="screen">
        <header style="text-align: center; margin-bottom: 20px;">
            <h1 id="titulo-preparacao" style="color: var(--dourado);">Partida Pronta!</h1>
            <p id="subtitulo-preparacao" style="font-family: sans-serif; font-weight: bold; font-size: 1.1rem; margin-top: 8px;"></p>
        </header>
        <div class="botoes-nav" style="width: 100%; max-width: 400px;">
            <button class="btn-supercell btn-voltar" onclick="voltarConfigTemporario()">VOLTAR</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
