<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combinação Real | Clash Party</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="tela-config" class="screen active">
        <header style="margin-bottom: 20px; text-align: center;">
            <h1 style="color: var(--dourado);">Combinação Real</h1>
            <p style="font-family: sans-serif; font-weight: bold; font-size: 1.2rem; margin-top: 5px;">Duelo de Memória</p>
        </header>

        <main class="games-container">
            <div class="game-card">
                <div class="seletor-grupo">
                    <label>Escolha o Universo:</label>
                    <div class="botoes-grupo">
                        <button class="btn-opcao active" id="btn-uni-clash" onclick="selecionarUniverso('clash')">👑 Clash Royale</button>
                        <button class="btn-opcao" id="btn-uni-brawl" onclick="selecionarUniverso('brawl')">⭐ Brawl Stars</button>
                    </div>
                </div>

                <div class="area-nomes">
                    <div class="input-group">
                        <label class="label-azul" id="label-j1">👑 Rei Azul (Jogador 1)</label>
                        <input type="text" id="nome-azul" placeholder="Nome do Jogador 1" class="input-jogador azul" autocomplete="off" oninput="validarNomes()">
                    </div>

                    <div class="input-group">
                        <label class="label-vermelho" id="label-j2">👑 Rei Vermelho (Jogador 2)</label>
                        <input type="text" id="nome-vermelho" placeholder="Nome do Jogador 2" class="input-jogador vermelho" autocomplete="off" oninput="validarNomes()">
                    </div>
                </div>

                <div class="botoes-nav">
                    <a href="../index.html" class="btn-supercell btn-voltar">VOLTAR</a>
                    <button class="btn-supercell btn-iniciar" id="btn-jogar" onclick="iniciarJogo()" disabled>JOGAR</button>
                </div>
            </div>
        </main>
    </div>

    <div id="tela-jogo" class="screen">
        <header style="text-align: center; margin-bottom: 20px;">
            <h1 id="titulo-jogo" style="color: var(--dourado);">Preparando...</h1>
            <p id="subtitulo-jogo" style="font-family: sans-serif; font-weight: bold; font-size: 1.1rem; margin-top: 8px;"></p>
        </header>
        <div class="botoes-nav" style="width: 100%; max-width: 400px;">
            <button class="btn-supercell btn-voltar" onclick="voltarConfig()">VOLTAR</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
