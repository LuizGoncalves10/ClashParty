<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta a Carta | Registro</title>
    <!-- Volta uma pasta para acessar o CSS global -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header style="margin-bottom: 20px;">
        <h1 style="color: var(--dourado);">Carta a Carta</h1>
        <p style="font-family: sans-serif; font-weight: bold; font-size: 1.2rem; margin-top: 5px;">Duelo de Dedução</p>
    </header>

    <main class="games-container">
        <div class="game-card">
            <h2>Registrar Reis</h2>
            <p style="margin-bottom: 20px;">Quem vai para a Arena?</p>
            
            <div class="input-group">
                <label class="label-azul">👑 Rei Azul (Jogador 1)</label>
                <input type="text" id="nome-azul" placeholder="Nome do Jogador 1" class="input-rei azul" autocomplete="off">
            </div>

            <div class="input-group">
                <label class="label-vermelho">👑 Rei Vermelho (Jogador 2)</label>
                <input type="text" id="nome-vermelho" placeholder="Nome do Jogador 2" class="input-rei vermelho" autocomplete="off">
            </div>

            <!-- Caixa de erro caso tentem iniciar sem nomes -->
            <div id="erro-nomes" class="error-msg">Preencha o nome dos dois Reis!</div>

            <!-- Botões de navegação -->
            <div class="botoes-nav">
                <a href="../index.html" class="btn-supercell btn-voltar">VOLTAR</a>
                <button class="btn-supercell btn-iniciar" onclick="iniciarDuelo()">INICIAR</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
